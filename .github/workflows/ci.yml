name: YCI CI
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: yci-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  syntax:
    name: Syntax and gate controls
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: shivammathur/setup-php@bf6b4fbd49ca58e4608c9c89fba0b8d90bd2a39f # 2.35.5
        with:
          php-version: '7.4'
          coverage: none
      - name: Minimum PHP syntax, JavaScript, Python and gate rejection controls
        run: |
          git ls-files -z '*.php' | xargs -0 -n1 php -l
          git ls-files -z '*.js' | xargs -0 -n1 node --check
          python3 -m py_compile scripts/test-isolated.py .github/scripts/required-gate.py .github/scripts/release_cli.py .github/scripts/release_lib.py tests/release-contract-tests.py
          python3 .github/scripts/required-gate.py --self-test
      - name: Release publisher contracts and exact distribution staging
        shell: bash
        run: |
          set -euo pipefail
          if grep -R -E 'yoohw-support-portal|ysp-(release|wporg)' \
            .github/actions/publisher-context \
            .github/scripts/release_cli.py \
            .github/scripts/release_lib.py \
            .github/workflows/release-prepare.yml \
            .github/workflows/publish-wordpress-org.yml \
            scripts/stage-distribution.sh \
            docs/releasing.md \
            tests/release-contract-tests.py; then
            echo "Support Portal publication identity leaked into YCI publisher" >&2
            exit 1
          fi
          command -v rsync >/dev/null
          bash scripts/stage-distribution.sh . "$RUNNER_TEMP/staged/yoohw-customer-intelligence"
          test -f "$RUNNER_TEMP/staged/yoohw-customer-intelligence/yoohw-customer-intelligence.php"
          test -f "$RUNNER_TEMP/staged/yoohw-customer-intelligence/readme.txt"
          test ! -e "$RUNNER_TEMP/staged/yoohw-customer-intelligence/.github"
          test ! -e "$RUNNER_TEMP/staged/yoohw-customer-intelligence/tests"
          test ! -e "$RUNNER_TEMP/staged/yoohw-customer-intelligence/docs"
          test ! -e "$RUNNER_TEMP/staged/yoohw-customer-intelligence/scripts"
          python3 tests/release-contract-tests.py
  integration:
    name: Integration (HPOS=${{ matrix.hpos }})
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        hpos: ['yes', 'no']
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: shivammathur/setup-php@bf6b4fbd49ca58e4608c9c89fba0b8d90bd2a39f # 2.35.5
        with:
          php-version: '8.4'
          extensions: mysqli, mbstring, xml, posix
          tools: composer:2.9.5
          coverage: none
      - name: Locked development dependencies
        env:
          COMPOSER_HOME: ${{ runner.temp }}/yci-composer
          COMPOSER_AUTH: '{}'
        run: composer install --no-interaction --no-progress --prefer-dist --no-plugins --no-scripts
      - name: Runtime versions and isolated safety/integration checks
        env:
          YCI_MODE: ${{ matrix.hpos }}
        run: |
          php --version
          mysqld --version
          python3 scripts/test-isolated.py --mysql-bin /usr/bin --mysqld /usr/sbin/mysqld --mode "$YCI_MODE"
  required:
    name: YCI Required CI
    if: ${{ always() }}
    needs: [syntax, integration]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Verify every required result (no skip lane)
        env:
          YCI_CLASSIFICATION: full
          YCI_NEEDS: ${{ toJSON(needs) }}
        run: python3 .github/scripts/required-gate.py
