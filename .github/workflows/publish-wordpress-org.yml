name: Publish Customer Intelligence to WordPress.org

'on':
  workflow_dispatch:
    inputs:
      operation:
        description: Publish or continue read-only verification/recovery
        required: true
        default: publish
        type: choice
        options: [publish, verify-only]
      preparation_run_id:
        description: Successful immutable Prepare run ID
        required: true
        type: string
      candidate_sha:
        description: Exact prepared candidate SHA
        required: true
        type: string
      version:
        description: Exact prepared version
        required: true
        type: string
      original_publish_run_id:
        description: Required for verify-only, including ambiguous commit recovery
        required: false
        default: ''
        type: string
      dry_run:
        description: No external mutation; disable only with explicit release authority
        required: true
        default: true
        type: boolean

permissions:
  actions: read
  checks: read
  contents: read

concurrency:
  group: wordpress-org-yoohw-customer-intelligence
  cancel-in-progress: false

env:
  OPERATION: ${{ inputs.operation }}
  DRY_RUN: ${{ inputs.dry_run && 'true' || 'false' }}
  CANDIDATE_SHA: ${{ inputs.candidate_sha }}
  CANDIDATE_DIR: ${{ github.workspace }}/candidate-data
  PREPARED_DIR: ${{ github.workspace }}/prepared
  VERSION: ${{ inputs.version }}
  PREPARATION_RUN_ID: ${{ inputs.preparation_run_id }}
  ORIGINAL_PUBLISH_RUN_ID: ${{ inputs.original_publish_run_id }}
  PYTHONDONTWRITEBYTECODE: '1'

jobs:
  preflight:
    name: Read-only WordPress.org publication preflight
    if: inputs.operation == 'publish'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout trusted publisher control plane
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          ref: ${{ github.sha }}
          path: control
          persist-credentials: false
      - uses: ./control/.github/actions/publisher-context
      - name: Snapshot WordPress.org SVN and stage locally only
        run: python3 control/.github/scripts/release_cli.py preflight
      - name: Persist exact Human approval target
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: wporg-preflight-${{ github.run_id }}
          path: ${{ runner.temp }}/yci-release/preflight-record.json
          if-no-files-found: error
          retention-days: 90
          overwrite: false

  dry-run:
    name: Dry-run final remote recheck
    needs: preflight
    if: inputs.operation == 'publish' && inputs.dry_run
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PREFLIGHT_DIR: ${{ github.workspace }}/preflight
    steps:
      - name: Checkout trusted publisher control plane
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          ref: ${{ github.sha }}
          path: control
          persist-credentials: false
      - uses: ./control/.github/actions/publisher-context
      - name: Download approved same-run preflight
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: wporg-preflight-${{ github.run_id }}
          path: preflight
      - name: Final recheck and local SVN staging only
        run: python3 control/.github/scripts/release_cli.py recheck

  production:
    name: Human-gated atomic WordPress.org publication
    needs: preflight
    if: inputs.operation == 'publish' && !inputs.dry_run
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: wordpress-org-production
    permissions:
      actions: read
      checks: read
      contents: write
    env:
      PREFLIGHT_DIR: ${{ github.workspace }}/preflight
      PUBLISH_ENVIRONMENT: wordpress-org-production
    outputs:
      state: ${{ steps.verify.outputs.state }}
    steps:
      - name: Checkout trusted publisher control plane
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          ref: ${{ github.sha }}
          path: control
          persist-credentials: false
      - uses: ./control/.github/actions/publisher-context
      - name: Download approved same-run preflight
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: wporg-preflight-${{ github.run_id }}
          path: preflight
      - name: Fresh remote recheck after Human approval
        run: python3 control/.github/scripts/release_cli.py recheck
      - name: Assert production Environment configuration before mutation
        env:
          WPORG_SVN_USERNAME: ${{ vars.WPORG_SVN_USERNAME }}
        shell: bash
        run: |
          set -euo pipefail
          test "$WPORG_SVN_USERNAME" = yoohw
      - name: Seal immutable annotated release Git tag
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 control/.github/scripts/release_cli.py seal
      - name: Single atomic SVN commit attempt
        id: commit
        env:
          GH_TOKEN: ${{ github.token }}
          WPORG_SVN_USERNAME: ${{ vars.WPORG_SVN_USERNAME }}
          WPORG_SVN_PASSWORD: ${{ secrets.WPORG_SVN_PASSWORD }}
        run: python3 control/.github/scripts/release_cli.py commit
      - name: Verify SVN and public WordPress.org package
        id: verify
        if: ${{ !cancelled() && steps.commit.outcome == 'success' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 control/.github/scripts/release_cli.py verify
      - name: Persist publication verification evidence
        if: ${{ always() && steps.verify.outcome != 'skipped' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: wporg-publication-${{ github.run_id }}
          path: ${{ runner.temp }}/yci-release/publication-record.json
          if-no-files-found: warn
          retention-days: 90
          overwrite: false
      - name: Persist ambiguous SVN commit attempt for recovery
        if: ${{ always() && steps.commit.outcome != 'skipped' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: wporg-attempt-${{ github.run_id }}
          path: ${{ runner.temp }}/yci-release/commit-attempt.json
          if-no-files-found: warn
          retention-days: 90
          overwrite: false

  verify-only:
    name: Read-only WordPress.org recovery and propagation check
    if: inputs.operation == 'verify-only'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PREFLIGHT_DIR: ${{ github.workspace }}/original-preflight
    outputs:
      state: ${{ steps.verify.outputs.state }}
    steps:
      - name: Checkout trusted publisher control plane
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          ref: ${{ github.sha }}
          path: control
          persist-credentials: false
      - uses: ./control/.github/actions/publisher-context
      - name: Download original production preflight
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: wporg-preflight-${{ inputs.original_publish_run_id }}
          path: original-preflight
          repository: ${{ github.repository }}
          run-id: ${{ inputs.original_publish_run_id }}
          github-token: ${{ github.token }}
      - name: Authenticate original run and verify remote state without SVN credentials
        id: verify
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 control/.github/scripts/release_cli.py recover
      - name: Persist verified or pending public state
        if: ${{ always() && steps.verify.outcome != 'skipped' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: wporg-publication-${{ github.run_id }}
          path: ${{ runner.temp }}/yci-release/publication-record.json
          if-no-files-found: warn
          retention-days: 90
          overwrite: false

  github-release:
    name: GitHub Release only after verified WordPress.org publication
    needs: [production, verify-only]
    if: >-
      ${{ always() && !inputs.dry_run &&
          ((needs.production.result == 'success' && needs.production.outputs.state == 'WPORG_PUBLIC_RELEASE_VERIFIED') ||
           (needs.verify-only.result == 'success' && needs.verify-only.outputs.state == 'WPORG_PUBLIC_RELEASE_VERIFIED')) }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: wordpress-org-production
    permissions:
      actions: read
      checks: read
      contents: write
    env:
      PUBLISH_ENVIRONMENT: wordpress-org-production
    steps:
      - name: Checkout trusted publisher control plane
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          ref: ${{ github.sha }}
          path: control
          persist-credentials: false
      - uses: ./control/.github/actions/publisher-context
      - name: Reverify public identity and create/reconcile GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 control/.github/scripts/release_cli.py release
